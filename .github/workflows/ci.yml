name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-cpp:
    name: Build C++ + golden regression
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup MSYS2 (MinGW g++)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc diffutils

      - name: Build C++ interpreter
        shell: msys2 {0}
        run: |
          cd src/cpp
          g++ -std=c++17 -O3 -flto -static -Wall -Wextra vesna.cpp main.cpp -o vesna.exe -ladvapi32 -lws2_32

      - name: Smoke test
        shell: msys2 {0}
        run: |
          cd src/cpp
          ./vesna.exe --version
          echo 'print("hi"),' | ./vesna.exe

      # golden 基准由 Python 参考实现 0.3.0 生成（tests/golden/），
      # 生成命令见 tests/golden/README.md；C++ 输出必须与之逐行一致
      - name: Regression vs golden
        shell: msys2 {0}
        run: |
          cd src/cpp
          export VESNA_HOME="$(pwd)/../.."
          ./vesna.exe tests/regression.ves > cpp.out 2>&1
          diff cpp.out tests/golden/regression.out && echo "REGRESSION MATCH"

      - name: 0.4 builtins smoke vs golden
        shell: msys2 {0}
        run: |
          cd src/cpp
          export VESNA_HOME="$(pwd)/../.."
          ./vesna.exe tests/smoke04.ves > cpp.out 2>&1
          diff cpp.out tests/golden/smoke04.out && echo "SMOKE04 MATCH"

      - name: FS test vs golden
        shell: msys2 {0}
        run: |
          cd src/cpp
          export VESNA_HOME="$(pwd)/../.."
          ./vesna.exe tests/fs_test.ves > cpp.out 2>&1
          diff cpp.out tests/golden/fs_test.out && echo "FS MATCH"

      # 1.2 tier-3 golden（C++ 生成；依赖同目录 tier3_data.json）
      - name: Tier 3 builtins vs golden
        shell: msys2 {0}
        run: |
          cd "$GITHUB_WORKSPACE/src/cpp/tests"
          export VESNA_HOME="$GITHUB_WORKSPACE"
          ../vesna.exe tier3.ves > golden_check.out 2>&1
          diff golden_check.out golden/tier3.out && echo "TIER3 MATCH"
          rm -f golden_check.out

      - name: Binary builtins vs golden
        shell: msys2 {0}
        run: |
          cd "$GITHUB_WORKSPACE/src/cpp/tests"
          export VESNA_HOME="$GITHUB_WORKSPACE"
          ../vesna.exe binary.ves > golden_check.out 2>&1
          diff golden_check.out golden/binary.out && echo "BINARY MATCH"
          rm -f golden_check.out

      # 1.4 第四梯队 golden（csv/ini/xml）
      - name: Tier 4 builtins vs golden
        shell: msys2 {0}
        run: |
          cd "$GITHUB_WORKSPACE/src/cpp/tests"
          export VESNA_HOME="$GITHUB_WORKSPACE"
          ../vesna.exe tier4.ves > golden_check.out 2>&1
          diff golden_check.out golden/tier4.out && echo "TIER4 MATCH"
          rm -f golden_check.out

      # concurrency 输出含线程顺序抖动，仅运行验证（不逐行 diff）
      - name: Concurrency builtins run check
        shell: msys2 {0}
        run: |
          cd "$GITHUB_WORKSPACE/src/cpp/tests"
          export VESNA_HOME="$GITHUB_WORKSPACE"
          ../vesna.exe concurrency.ves > /dev/null 2>&1 && echo "CONCURRENCY RUN OK"

      # 1.3 vpm 校验冒烟
      - name: vpm validation smoke
        shell: msys2 {0}
        run: |
          cd /tmp
          export VESNA_HOME="$GITHUB_WORKSPACE"
          if "$GITHUB_WORKSPACE/src/cpp/vesna.exe" --pkg init "Bad Name" > /dev/null 2>&1; then
            echo "vpm init should reject bad name"; exit 1
          fi
          mkdir -p badpkg && echo '{"name":"badpkg","version":"v1"}' > badpkg/vesna-pkg.json
          if "$GITHUB_WORKSPACE/src/cpp/vesna.exe" --pkg install badpkg > /dev/null 2>&1; then
            echo "vpm install should reject bad version"; exit 1
          fi
          rm -rf badpkg
          echo "VPM SMOKE OK"

      # 1.4 原生 C++ LSP 冒烟（vesna.exe --lsp，JSON-RPC 文件重定向）
      - name: LSP smoke
        shell: msys2 {0}
        run: |
          python "$GITHUB_WORKSPACE/src/cpp/tests/lsp_cpp_smoke.py" "$GITHUB_WORKSPACE/src/cpp/vesna.exe" | tail -n 1
          python "$GITHUB_WORKSPACE/src/cpp/tests/lsp_cpp_smoke.py" "$GITHUB_WORKSPACE/src/cpp/vesna.exe" | grep -q "ALL C++ LSP TESTS PASSED"

      - name: Example scripts vs golden
        shell: msys2 {0}
        run: |
          cd src/cpp
          export VESNA_HOME="$(pwd)/../.."
          for name in csv2json cut extract grep head logstat replace sed sort stat tail uniq wc; do
            case "$name" in
              csv2json) args="../../examples/sample.csv" ;;
              cut)      args=", 2 ../../examples/sample.csv" ;;
              extract)  args="../../examples/sample.txt" ;;
              grep)     args="ERROR ../../examples/sample.txt" ;;
              head)     args="3 ../../examples/sample.txt" ;;
              logstat)  args="../../examples/sample.txt" ;;
              replace)  args="a X ../../examples/sample.txt" ;;
              sed)      args="\d+ N ../../examples/sample.txt" ;;
              sort)     args="../../examples/sample.txt" ;;
              stat)     args="../../examples/sample.txt" ;;
              tail)     args="3 ../../examples/sample.txt" ;;
              uniq)     args="../../examples/sample.txt" ;;
              wc)       args="../../examples/sample.txt" ;;
            esac
            ./vesna.exe "../../examples/$name.ves" $args > cpp.out 2>&1
            diff cpp.out "tests/golden/examples/$name.out" || exit 1
          done
          echo "EXAMPLES MATCH"

      - name: Upload C++ binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: vesna-windows-x64
          path: src/cpp/vesna.exe
