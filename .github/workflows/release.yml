name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  release:
    name: Build release assets
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSYS2 (MinGW g++)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc

      - name: Build C++ interpreter
        shell: msys2 {0}
        run: |
          cd src/cpp
          g++ -std=c++17 -O3 -flto -static -Wall -Wextra vesna.cpp main.cpp -o vesna_cpp.exe -ladvapi32

      - name: Package Python exe (PyInstaller)
        shell: msys2 {0}
        run: |
          python -m pip install --quiet pyinstaller
          cd src
          python -m PyInstaller --onefile --name vesna vesna.py

      - name: Package VSCode extension (.vsix)
        run: |
          cd vesna-vscode
          npm install --quiet
          npx --yes @vscode/vsce package --out vesna-0.3.0.vsix

      - name: Assemble release folder
        shell: msys2 {0}
        run: |
          V=0.3.0
          mkdir -p release/vesna-$V-windows-x64/{bin,lib,examples,docs}
          cp src/cpp/vesna_cpp.exe release/vesna-$V-windows-x64/bin/
          cp src/dist/vesna.exe release/vesna-$V-windows-x64/bin/ || true
          cp lib/*.ves release/vesna-$V-windows-x64/lib/
          cp examples/*.ves release/vesna-$V-windows-x64/examples/
          cp docs/*.md release/vesna-$V-windows-x64/docs/
          cp README.md CHANGELOG.md LICENSE icon.png vesna.ico release/vesna-$V-windows-x64/
          cp vesna-vscode/vesna-0.3.0.vsix release/vesna-$V-windows-x64/vesna-vscode-0.3.0.vsix
          cd release
          powershell -Command "Compress-Archive -Path vesna-$V-windows-x64 -DestinationPath vesna-$V-windows-x64.zip -Force"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/vesna-*.zip
            release/vesna-*/vesna-vscode-*.vsix
          generate_release_notes: true
