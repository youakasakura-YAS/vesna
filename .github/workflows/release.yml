name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  release:
    name: Build release assets
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup MSYS2 (MinGW g++)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc diffutils

      - name: Build C++ interpreter
        shell: msys2 {0}
        run: |
          cd src/cpp
          g++ -std=c++17 -O3 -flto -static -Wall -Wextra vesna.cpp lsp.cpp main.cpp -o vesna.exe -ladvapi32 -lws2_32

      - name: Package VSCode extension (.vsix)
        run: |
          cd vesna-vscode
          npm install --quiet
          npx --yes @vscode/vsce package --out vesna-0.5.0.vsix

      - name: Assemble release folder
        shell: msys2 {0}
        run: |
          V=1.4.0
          mkdir -p release/vesna-$V-windows-x64/{bin,lib,examples,docs}
          cp src/cpp/vesna.exe release/vesna-$V-windows-x64/bin/
          cp lib/*.ves release/vesna-$V-windows-x64/lib/
          cp examples/*.ves release/vesna-$V-windows-x64/examples/
          cp docs/*.md release/vesna-$V-windows-x64/docs/
          cp README.md README.zh-CN.md CHANGELOG.md CHANGELOG.zh-CN.md CONTRIBUTING.md CONTRIBUTING.zh-CN.md LICENSE icon.png vesna.ico release/vesna-$V-windows-x64/
          cp vesna-vscode/vesna-0.5.0.vsix release/vesna-$V-windows-x64/vesna-0.5.0.vsix
          if [ -f release/RELEASE-NOTES-$V.md ]; then cp release/RELEASE-NOTES-$V.md release/vesna-$V-windows-x64/; fi
          cd release
          powershell -Command "Compress-Archive -Path vesna-$V-windows-x64 -DestinationPath vesna-$V-windows-x64.zip -Force"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/vesna-*.zip
            release/vesna-*/vesna-0.5.0.vsix
          generate_release_notes: true
